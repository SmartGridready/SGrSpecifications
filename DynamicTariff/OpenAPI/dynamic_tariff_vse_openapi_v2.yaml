  /customerTariffs:
    get:
      summary: Retrieves tariff prices specific to the customer's metering point.
      description: |
        This endpoint retrieves tariffs specific for the customer's metering point in a given time period.
        The endpoint is protected and requires an EMS linked to the customer account and metering point.

        **Flow**
        1) The EMS calls the `GET /customerTariffs` endpoint with a **Bearer access token** and the `ems_instance_id` query parameter.
           - The bearer access token can initially be acquired using the OIDC authorization code flow. Once expired a new access token can be obtained at the token endpoint using the OIDC refresh token flow.
           - The `ems_instance_id` must be unique and persistent. Best practice is to use the serial number of the EMS instance.
        2) Server validates the access token, derives the customer identity, and decides:
           - If the EMS was previously linked, the response contains the tariff prices.
           - If the EMS was not linked, an error 403 is returned.
      operationId: get-customer-tariffs-v2
      tags:
        - individual
      parameters:
        - name: ems_instance_id
          in: query
          description: |
            EMS installation/serial identifier; used to identify the EMS instance and its binding to a metering point
          required: true
          schema:
            type: string
            maxLength: 128
        - name: tariff_type
          in: query
          description: Filters by tariff type. If omitted, all applicable tariff types are returned.
          schema:
            $ref: '#/components/schemas/TariffType'
        - name: start_timestamp
          in: query
          description: |
            Marks the begin of the price retrieval period.
            If omitted, one day before the `end_timestamp` is applied.
            If both `start_timestamp` and `end_timestamp` are omitted, the start of the current day is applied.
            The `start_timestamp` of the first returned interval should be identical to or the one prior to this parameter.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00+01:00'
        - name: end_timestamp
          in: query
          description: |
            Marks the end of the price retrieval period.
            If omitted, one day after the `start_timestamp` is applied.
            If both `start_timestamp` and `end_timestamp` are omitted, the end of the current day is applied.
            The `end_timestamp` of the last returned interval should be identical to or the one after this parameter.
          schema:
            type: string
            format: date-time
          example: '2026-01-02T00:00:00+01:00'
      responses:
        '200':
          description: Tariff prices retrieved successfully.
