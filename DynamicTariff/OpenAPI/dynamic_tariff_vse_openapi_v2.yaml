  /emsLink:
    get:
      summary: Retrieves the link status of an EMS instance.
      description: |
        This endpoint is used to retrieve information about the current link status of the customer and EMS instance.
        Linking in this context means to establish a logical connection between the EMS instance and the customer account, which also entails letting the customer select a metering point, which determines the tariff product to be used by the `/customerTariffs` endpoint.
        It is therefore required to complete the linking process before calling the `/customerTariffs` endpoint.
        In addition to the link status, the response also contains a redirect URI, which the customer can be redirected to in order to complete the linking process or to change the selected metering point.
        The EMS must not assume that the link remains valid indefinitely, since the customer can unlink the EMS at any given moment.
        
        **Flow**
        1) The EMS calls the `GET /emsLink` endpoint with a **Bearer access token**, the `ems_instance_id` and `redirect_uri` query parameters.
           - The bearer access token can initially be acquired using the OIDC authorization code flow. Once expired a new access token can be obtained at the token endpoint using the OIDC refresh token flow.
           - The `ems_instance_id` must be unique and persistent. Best practice is to use the serial number of the EMS instance.
        2) Server validates the token, derives the customer identity, and decides:
           - If the customer has already completed the linking process, the response contains `link_status: "link_established"`.
           - If the customer has not yet completed the linking process, the response contains `link_status: "link_required"`.
           - If linking is currently not possible (e.g. if the customer is currently not able to access any valid metering points), the response contains `link_status: "link_unavailable"`.
        3) The EMS decides the next step in accordance to the response:
           - `link_unavailable`: It is currently impossible to complete the linking process and the EMS should handle this case accordingly. The EMS should not redirect the user to the `linking_process_redirect_uri`.
           - `link_required`: The EMS must redirect the customer to the URI provided in `linking_process_redirect_uri`, before calling the `/customerTariffs` endpoint. After the user finishes the process, a return link to the EMS will be presented to the user. The EMS is free to define any valid `https://` URI that points to the EMS web application as return URI, where the user is guided to after completing the process. Other URI schemes than `https` or URIs that point to other locations than the EMS web application are not allowed. The EMS must ensure the validity of the return URI.
           - `link_established`: The EMS link has already been established and the EMS can proceed with calling the `/customerTariffs` endpoint. The customer can also be redirected to the URI provided in `linking_process_redirect_uri`, in order to repeat the process, which might entail changing the metering point selection.
        4) After the linking process is completed the EMS may use the `/customerTariffs` endpoint to retrieve tariff information for the selected metering point.
      operationId: get-ems-link-v2
      tags:
        - individual
      parameters:
        - name: ems_instance_id
          in: query
          description: |
            EMS installation/serial identifier; will be stored with the binding.
          required: true
          schema:
            type: string
            maxLength: 128
        - name: redirect_uri
          in: query
          description: |
            The EMS-provided callback URL where the user is guided to after completing the linking process.
          required: true
          schema:
            type: string
            format: uri
            maxLength: 400
      responses:
        '200':
          description: EMS link status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmsLinkResponse'
        '400':
          description: Incorrect query parameters were given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Missing query parameter 'ems_instance_id'.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Insufficient scope.
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: An internal error occurred.
      security:
        - OpenIdConnect: [openid, offline_access]
    delete:
      summary: Unlinks an EMS instance.
      description: |
        This endpoint is used to unlink a previously linked EMS instance.

        **Flow**
        1) The EMS calls the `DELETE /emsLink` endpoint with a **Bearer access token** and the `ems_instance_id` query parameters.
           - The bearer access token can initially be acquired using the OIDC authorization code flow. Once expired a new access token can be obtained at the token endpoint using the OIDC refresh token flow.
           - The `ems_instance_id` must be unique and persistent. Best practice is to use the serial number of the EMS instance.
        2) Server validates the token, derives the customer identity, and decides:
           - If the EMS was previously linked, the response contains `unlink_status: "link_removed"`.
           - If the EMS was not linked, the response contains `error: "link_not_found"`.
        3) After the unlinking process is completed the EMS may no longer use the `/customerTariffs` endpoint.
      operationId: delete-ems-link-v2
      tags:
        - individual
      parameters:
        - name: ems_instance_id
          in: query
          description: |
            EMS installation/serial identifier.
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: EMS unlinked successfully or no link found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmsUnlinkResponse'
              example:
                unlink_status: link_removed
        '400':
          description: Incorrect query parameters were given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Missing query parameter 'ems_instance_id'.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Insufficient scope.
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: An internal error occurred.
      security:
        - OpenIdConnect: [openid, offline_access]
components:
  schemas:
    TariffName:
      type: string
      enum:
      # TODO:
      # Define your actual tariff product names here, since they are provider-specific.
      # If you do not offer different tariffs, remove the 'enum' part and do not process the query parameter in your implementation.
        - example_tariff
      description: |
        Tariff names specified by DSO
          * `example_tariff` - An example tariff
    TariffType:
      type: string
      enum:
        - electricity
        - grid
        - metering
        - national_fees
        - regional_fees
        - dso
        - dso_complete
        - integrated
        - integrated_complete
        - feed_in
        - refund
      description: |
        Tariff types specified by VSE
          * `electricity` - Electricity energy supply to end consumers
          * `grid` - Grid usage (distribution and transmission networks) including general and individual system services, grid surcharge according to Art. 35 EnG + electricity reserve + socialized costs via the transmission grid
          * `metering` - Metering infrastructure fees
          * `national_fees` - National surcharges (e.g. Swissgrid)
          * `regional_fees` - Local or regional surcharges (e.g. concession fees)
          * `dso` - Combination of `grid`, `metering` and `national_fees`
          * `dso_complete` - Combination of `grid`, `metering`, `national_fees` and `regional_fees`
          * `integrated` - Combination of `electricity` and `dso`
          * `integrated_complete` - Combination of `electricity` and `dso_complete`
          * `feed_in` - Compensation for feed-in into grid (positive value means reimbursement of customer)
          * `refund` - Refund for grid supportive storage operation (positive value means reimbursement of customer)
    TariffUnit:
      type: string
      enum:
        - CHF/kWh
        - CHF/kVarh
        - CHF/y
        - CHF/m
        - CHF/w
        - CHF/d
        - CHF/12h
        - CHF/6h
        - CHF/4h
        - CHF/2h
        - CHF/1h
        - CHF/30min
        - CHF/15min
        - CHF/kW/y
        - CHF/kW/m
        - CHF/kW/w
        - CHF/kW/d
        - CHF/kW/12h
        - CHF/kW/6h
        - CHF/kW/4h
        - CHF/kW/2h
        - CHF/kW/1h
        - CHF/kW/30min
        - CHF/kW/15min
      description: |
        Price unit:
          * `CHF/kWh` - CHF per kWh
          * `CHF/kVarh` - CHF per kVarh
          * `CHF/y` - CHF per year
          * `CHF/m` - CHF per month
          * `CHF/w` - CHF per week
          * `CHF/d` - CHF per day
          * `CHF/12h` - CHF per 12 hours
          * `CHF/6h` - CHF per 6 hours
          * `CHF/4h` - CHF per 4 hours
          * `CHF/2h` - CHF per 2 hours
          * `CHF/1h` - CHF per hour
          * `CHF/30min` - CHF per 30 minutes
          * `CHF/15min` - CHF per 15 minutes
          * `CHF/kW/y` - CHF per kW per year
          * `CHF/kW/m` - CHF per kW per month
          * `CHF/kW/w` - CHF per kW per week
          * `CHF/kW/d` - CHF per kW per day
          * `CHF/kW/12h` - CHF per kW per 12 hours
          * `CHF/kW/6h` - CHF per kW per 6 hours
          * `CHF/kW/4h` - CHF per kW per 4 hours
          * `CHF/kW/2h` - CHF per kW per 2 hours
          * `CHF/kW/1h` - CHF per kW per hour
          * `CHF/kW/30min` - CHF per kW per 30 minutes
          * `CHF/kW/15min` - CHF per kW per 15 minutes
    TariffPriceItem:
      type: object
      required:
        - start_timestamp
        - end_timestamp
      properties:
        start_timestamp:
          type: string
          format: date-time
          description: The begin of the time interval, formatted as ISO-8601 time stamp.
        end_timestamp:
          type: string
          format: date-time
          description: The end of the time interval, formatted as ISO-8601 time stamp.
        electricity:
          $ref: '#/components/schemas/TariffTypeItem'
        grid:
          $ref: '#/components/schemas/TariffTypeItem'
        metering:
          $ref: '#/components/schemas/TariffTypeItem'
        national_fees:
          $ref: '#/components/schemas/TariffTypeItem'
        regional_fees:
          $ref: '#/components/schemas/TariffTypeItem'
        dso:
          $ref: '#/components/schemas/TariffTypeItem'
        dso_complete:
          $ref: '#/components/schemas/TariffTypeItem'
        integrated:
          $ref: '#/components/schemas/TariffTypeItem'
        integrated_complete:
          $ref: '#/components/schemas/TariffTypeItem'
        feed_in:
          $ref: '#/components/schemas/TariffTypeItem'
        refund:
          $ref: '#/components/schemas/TariffTypeItem'
      description: A price item of a time interval, contains tariff types.
      additionalProperties: true
    TariffTypeItem:
      type: object
      nullable: true
      required: 
        - tariff_name
      properties:
        tariff_name:
          type: string
          description: The tariff name assigned to the tariff type.
        standard_basegroup:
          type: boolean
          nullable: true
          description: Defines if the tariff is a standard grid usage tariff for a base customer group.
        canton_taxes:
          type: boolean
          nullable: true
          description: Defines if cantonal taxes are applicable.
        canton_name:
          type: string
          nullable: true
          description: The canton name.
        municipality_taxes:
          type: boolean
          nullable: true
          description: Defines if municipality taxes are applicable.
        municipality_number:
          type: number
          format: integer
          nullable: true
          description: The municipality number from BFS (Hist. code with 5 digits).
        municipality_name:
          type: string
          nullable: true
          description: The municipality name.
        base:
          $ref: '#/components/schemas/TariffComponentItem'
        energy:
          $ref: '#/components/schemas/TariffComponentItem'
        power:
          $ref: '#/components/schemas/TariffComponentItem'
        reactive_energy:
          $ref: '#/components/schemas/TariffComponentItem'
      description: A tariff type in a time interval, contains tariff components.
      additionalProperties: true
    TariffComponentItem:
      type: object
      nullable: true
      required:
        - unit
        - value
      properties:
        unit:
          $ref: '#/components/schemas/TariffUnit'
        value:
          type: number
          format: decimal
          description: The numeric price value without VAT-taxes.
      description: A tariff component value.
    TariffResponse:
      type: object
      required:
        - publication_timestamp
        - prices
      properties:
        publication_timestamp:
          type: string
          format: date-time
          nullable: true
          description: The time stamp of tariff publication. Can be `null` when no data has been published yet.
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TariffPriceItem'
          description: Contains the prices for the requested time intervals.
      description: A dynamic tariff price response.
      additionalProperties: true
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: The error message.
      description: An generic API error response.
    EmsLinkStatusCode:
      type: string
      enum:
        - link_unavailable
        - link_required
        - link_established
      description: |
        EMS link status codes:
          * `link_unavailable` - No metering point available for linking
          * `link_required` - EMS is not yet linked
          * `link_established` - EMS has been linked successfully
    EmsUnlinkStatusCode:
      type: string
      enum:
        - link_not_found
        - link_removed
      description: |
        EMS link status codes:
          * `link_not_found` - EMS not linked
          * `link_removed` - EMS has been unlinked successfully
    EmsLinkResponse:
      type: object
      required:
        - link_status
        - linking_process_redirect_uri
      properties:
        link_status:
          $ref: '#/components/schemas/EmsLinkStatusCode'
        linking_process_redirect_uri:
          type: string
          format: uri
          description: |
            The linking process redirect URI can be used to redirect the logged in user to the process page,
            to establish or edit the EMS link, which entails selecting the metering point at the EMS location.
            The URI contains a parameter `ems_access_token`, that holds the bearer token that was used to authenticate
            the endpoint request. The token has to be valid at the time of the redirect or otherwise the request
            will be rejected. If there is a delay between calling the endpoint and initiating the redirect, the EMS has
            to ensure the token has not expired or must update the parameter with a fresh token.
      description: An EMS link status response.
    EmsUnlinkResponse:
      type: object
      required:
        - unlink_status
      properties:
        unlink_status:
          $ref: '#/components/schemas/EmsUnlinkStatusCode'
      description: An EMS unlink status response.
  securitySchemes:
    OpenIdConnect:
      type: oauth2
      description: |
        OAuth2 with OpenID Connect. Use the Authorization Code flow below to get an access token.
        Confidential clients authenticate via **HTTP Basic** header.
        1) Redirect the user to the **Authorization URL** for login/consent (PKCE recommended for confidential clients, mandatory for public clients).
        2) Exchange the returned `code` for tokens at **Token URL**, authenticating the client. Confidential clients authenticate via **HTTP Basic** header.
        3) Call protected API endpoints with `Authorization: Bearer <access_token>`.
      flows:
        authorizationCode:
          # TODO:
          # Replace this with your actual OpenID server configuration.
          # Endpoint for end-user login and consent
          authorizationUrl: https://auth.tariffs.example.org/oauth/protocol/openid-connect/auth
          # Endpoint(s) to retrieve tokens (authorization_code grant, refresh_token grant)
          tokenUrl: https://auth.tariffs.example.org/oauth/protocol/openid-connect/token
          refreshUrl: https://auth.tariffs.example.org/oauth/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect ID token
            offline_access: Request refresh token for offline access
      x-usePkceWithAuthorizationCodeGrant: true
