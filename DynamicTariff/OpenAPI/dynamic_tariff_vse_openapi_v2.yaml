# OpenAPI Specification TEMPLATE for a Dynamic Tariff Price API.
# Based on the VSE standard https://www.strom.ch/de/shop/dynamische-netznutzungstarife-im-verteilnetz-hdn-ch-2025.
# This template contains the essential endpoints and schemas.
#
# Provided by SmartGridready: https://smartgridready.ch/loesungen/dynamischetarife
# Author: Matthias Krebs
#
# Version 2.0.0-preview (2026-07-01)
#

openapi: 3.0.3
info:
  title: Dynamic Tariff Retrieval API
  description: |
    API specification template to retrieve tariff prices of an electricity provider.
    Follows the VSE standard https://www.strom.ch/de/shop/dynamische-netznutzungstarife-im-verteilnetz-hdn-ch-2025.

    Use this template to implement your dynamic tariff API.
  version: '2.0.0'
servers:
  # TODO:
  # Replace this with your actual API server URL, including base path.
  # Endpoint paths will be relative to this URL!
  - url: https://api.tariffs.example.org/v2
    description: Example API server base URL
paths:
  /tariffs:
    get:
      summary: Retrieves tariff prices.
      description: |
        This endpoint retrieves dynamic tariff prices in a given time period.
        The endpoint is public and requires no authentication.
      operationId: get-tariffs-v2
      tags:
        - public
      parameters:
        - name: tariff_type
          in: query
          description: Filters by tariff type. If omitted, all available tariff types are returned.
          schema:
            $ref: '#/components/schemas/TariffType'
        - name: tariff_name
          in: query
          description: Filters by a specific tariff product of the provider. If omitted, the provider's default tariff is returned.
          schema:
            $ref: '#/components/schemas/TariffName'
        - name: start_timestamp
          in: query
          description: |
            Marks the begin of the price retrieval period.
            If omitted, one day before the `end_timestamp` is applied.
            If both `start_timestamp` and `end_timestamp` are omitted, the start of the current day is applied.
            The `start_timestamp` of the first returned interval should be identical to or the one prior to this parameter.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00+01:00'
        - name: end_timestamp
          in: query
          description: |
            Marks the end of the price retrieval period.
            If omitted, one day after the `start_timestamp` is applied.
            If both `start_timestamp` and `end_timestamp` are omitted, the end of the current day is applied.
            The `end_timestamp` of the last returned interval should be identical to or the one after this parameter.
          schema:
            type: string
            format: date-time
          example: '2026-01-02T00:00:00+01:00'
      responses:
        '200':
          description: Tariff prices retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
              examples:
                minimal:
                  summary: Minimal tariff response example (grid only).
                  value:
                    publication_timestamp: '2026-01-31T18:00:00+01:00'
                    prices:
                      - start_timestamp: '2026-02-01T00:00:00+01:00'
                        end_timestamp: '2026-02-01T00:15:00+01:00'
